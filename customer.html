<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - Live Status</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background-color: #f8f9fa; padding: 15px; }
        .container { max-width: 450px; margin: auto; }
        .card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; float: right; }
        .Unpaid { background: #fce8e6; color: #c5221f; }
        .Paid { background: #e6f4ea; color: #137333; }
        .search-box { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background:#1b2a47; color:#fff;">
        <h3 style="text-align:center;">📋 Customer Loan Status</h3>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search by Account ID or Name..." onkeyup="filterData()">

    <div id="customerRecordList">
        <p style="text-align:center; color:#777;">Live data load ho raha hai...</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtGWZDyA45EyaUWwDk2KZvR0tmxQALGyw",
        authDomain: "loan-manager-2.firebaseapp.com",
        projectId: "loan-manager-2",
        storageBucket: "loan-manager-2.firebasestorage.app",
        messagingSenderId: "768803895002",
        appId: "1:768803895002:web:8a666e728b48cfcc2817e3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ⚠️ Ahem Step: Yahan Admin Panel se mila hua Admin UID paste karein
    const ADMIN_UID = "ADMIN_USER_UID_YAHAN_RAKHEIN"; 

    let allRecords = [];

    // Instant Real-Time Sync Listener
    db.collection('shops').doc(ADMIN_UID).collection('records')
      .onSnapshot(snapshot => {
          allRecords = [];
          snapshot.forEach(doc => {
              allRecords.push({ id: doc.id, ...doc.data() });
          });
          renderCustomerUI(allRecords);
      }, err => {
          document.getElementById('customerRecordList').innerHTML = `<p style="color:red; text-align:center;">Data Load Error: Admin UID Verify Karein</p>`;
      });

    function renderCustomerUI(records) {
        const list = document.getElementById('customerRecordList');
        list.innerHTML = '';

        if(records.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#777;">Koi record majood nahi hai.</p>`;
            return;
        }

        records.forEach(item => {
            list.innerHTML += `
                <div class="card">
                    <span class="status-badge ${item.status}">${item.status}</span>
                    <h4 style="color:#1b2a47;">${item.name}</h4>
                    <p style="font-size:13px; color:#555; margin-top:4px;">
                        <b>Account ID:</b> ${item.accountId}<br>
                        <b>Foundation:</b> ${item.foundation}<br>
                        <b>Amount:</b> Rs. ${item.amount}<br>
                        <b>Date:</b> ${item.paymentDate}
                    </p>
                </div>
            `;
        });
    }

    function filterData() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allRecords.filter(r => 
            r.name.toLowerCase().includes(q) || r.accountId.toLowerCase().includes(q)
        );
        renderCustomerUI(filtered);
    }
</script>
</body>
</html>
