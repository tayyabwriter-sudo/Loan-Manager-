<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Manager Pro - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background-color: #f2f4f7; color: #333; padding-bottom: 30px; }
        .header { background: #1b2a47; color: #fff; padding: 15px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px; }
        .btn-main { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .uid-box { background: #eef2f5; padding: 10px; border-radius: 6px; font-size: 12px; word-break: break-all; margin-bottom: 10px; border: 1px dashed #1b2a47; }
        .record-card { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 5px solid #e74c3c; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .record-card.Paid { border-left-color: #27ae60; }
    </style>
</head>
<body>

<div id="authSection" class="container" style="margin-top: 50px;">
    <div class="card">
        <h3>Dukandar Login / Register</h3>
        <input type="email" id="authEmail" class="form-control" placeholder="Email">
        <input type="password" id="authPassword" class="form-control" placeholder="Password">
        <button class="btn-main" onclick="handleLogin()">Login</button>
    </div>
</div>

<div id="appSection" style="display:none;">
    <div class="header">
        <span id="shopTitle">📱 Loan Manager Pro</span>
        <button onclick="auth.signOut()" style="background:#c0392b; color:#fff; border:none; padding:6px 10px; border-radius:4px;">Logout</button>
    </div>

    <div class="container">
        <!-- Admin UID Info Box -->
        <div class="uid-box">
            <b>🔑 Aapka Admin UID (Customer Portal ke liye):</b><br>
            <span id="adminUidDisplay">Loading...</span>
        </div>

        <div class="card">
            <h4>Naya Record Add Karein</h4>
            <select id="foundation" class="form-control">
                <option value="Kashif">Kashif</option>
                <option value="RCDP">RCDP</option>
                <option value="NRSP">NRSP</option>
            </select>
            <input type="text" id="accountId" class="form-control" placeholder="Account / Loan ID">
            <input type="text" id="borrowerName" class="form-control" placeholder="Name">
            <input type="number" id="amount" class="form-control" placeholder="Amount (Rs)">
            <input type="date" id="paymentDate" class="form-control">
            <button class="btn-main" id="saveBtn" onclick="addRecord()">+ Instant Save Online</button>
        </div>

        <div id="adminRecordList"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtGWZDyA45EyaUWwDk2KZvR0tmxQALGyw",
        authDomain: "loan-manager-2.firebaseapp.com",
        projectId: "loan-manager-2",
        storageBucket: "loan-manager-2.firebasestorage.app",
        messagingSenderId: "768803895002",
        appId: "1:768803895002:web:8a666e728b48cfcc2817e3"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('adminUidDisplay').innerText = user.uid;
            listenToLiveRecords();
        } else {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
        }
    });

    function handleLogin() {
        const e = document.getElementById('authEmail').value;
        const p = document.getElementById('authPassword').value;
        auth.signInWithEmailAndPassword(e, p).catch(err => {
            auth.createUserWithEmailAndPassword(e, p).catch(e2 => alert(e2.message));
        });
    }

    async function addRecord() {
        const foundation = document.getElementById('foundation').value;
        const accountId = document.getElementById('accountId').value.trim();
        const name = document.getElementById('borrowerName').value.trim();
        const amount = document.getElementById('amount').value;
        const paymentDate = document.getElementById('paymentDate').value;

        if (!accountId || !name || !amount) { alert('Sari fields bharein!'); return; }

        // Live Write Direct to Global Customer Path
        await db.collection('shops').doc(currentUser.uid).collection('records').add({
            foundation, accountId, name,
            amount: parseFloat(amount),
            paymentDate,
            status: 'Unpaid',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('accountId').value = '';
        document.getElementById('borrowerName').value = '';
        document.getElementById('amount').value = '';
        alert("✅ Record Online Upload Ho Gaya!");
    }

    function listenToLiveRecords() {
        db.collection('shops').doc(currentUser.uid).collection('records').orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
            const list = document.getElementById('adminRecordList');
            list.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                list.innerHTML += `
                    <div class="record-card ${data.status}">
                        <b>${data.name}</b> (${data.foundation}) - Rs. ${data.amount}<br>
                        <small>ID: ${data.accountId} | Status: <b>${data.status}</b></small>
                    </div>
                `;
            });
        });
    }
</script>
</body>
</html>
